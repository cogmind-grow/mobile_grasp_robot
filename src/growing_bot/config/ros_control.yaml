# 模拟控制流程
# 发布话题控制指令给
#   ↓ /diff_drive_controller/cmd_vel
# diff_drive_controller
#   ↓ 下发左右轮速度
# mock_components/GenericSystem
#   ↓ 模拟并返回关节位置、速度
# joint_state_broadcaster
#   ↓ 发布 /joint_states
# robot_state_publisher
#   ↓ 计算并发布轮子 TF
# RViz 显示轮子旋转

# Gazebo Classic 机械臂：
#   gazebo_ros2_control/GazeboSystem + arm_controller 保持关节位置（站立）

# Gazebo Sim (gz)：
# 将硬件插件换为 gz_ros2_control/GazeboSimSystem，并加载
# gz_ros2_control::GazeboSimROS2ControlPlugin

# /**/ 匹配带或不带命名空间的节点（如 /growing_bot/controller_manager）
/**/controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/**/diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["base_left_joint"]
    right_wheel_names: ["base_right_joint"]

    wheel_separation: 0.45
    wheel_radius: 0.1

    odom_frame_id: "odom"
    base_frame_id: "base_footprint"
    # Avoid TF frames like growing_bot/odom (breaks MoveIt planning frame)
    tf_frame_prefix_enable: false
    tf_frame_prefix: ""

    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    open_loop: false
    enable_odom_tf: true
    publish_rate: 50.0
    cmd_vel_timeout: 0.5

    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0
    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0

/**/arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
    allow_nonzero_velocity_at_trajectory_end: false

/**/gripper_controller:
  ros__parameters:
    joints:
      - gripper_left_finger_joint
      - gripper_right_finger_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
    allow_nonzero_velocity_at_trajectory_end: false
